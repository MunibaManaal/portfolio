name: Update GitHub stats

on:
  schedule:
    - cron: "17 3 * * *"     # every day at 03:17 UTC (8:17 am in Pakistan)
  workflow_dispatch:          # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write             # lets the workflow save the updated JSON file to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch the latest stats
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/fetch-github-stats.py

      - name: Save the new stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-stats.json
          git diff --staged --quiet || git commit -m "Update GitHub stats"
          git push
